syntax = "proto3";

package io.github.tobia80.rust.raft_network;

// Internal Raft-style RPC for inter-node consensus. This is NOT in the Scala
// project — the Scala impl uses MicroRaft which sends serialized Java
// RaftMessage objects over the existing `DRefRaft.SendCommand` RPC. For the
// Rust port we use a simplified consensus protocol with its own service so
// the messages have a stable wire format (no Java serialization required).

// AppendEntries RPC: leader replicates log entries to followers and acts as a
// heartbeat. For our simplified consensus the "entry" is the full applied
// command — followers re-apply it locally.
message AppendEntriesRequest {
  string leader_id = 1;
  uint64 term = 2;
  // Opaque command payload (msgpack-encoded DRefCommand).
  bytes command = 3;
  // Monotonic sequence number from the leader for ordering and dedup.
  uint64 seq = 4;
}

message AppendEntriesResponse {
  bool success = 1;
  uint64 term = 2;
}

// Heartbeat: leader liveness probe. Used by followers to detect leader loss
// and trigger an election.
message HeartbeatRequest {
  string leader_id = 1;
  uint64 term = 2;
}

message HeartbeatResponse {
  bool acknowledged = 1;
  uint64 term = 2;
}

// Vote RPC: candidate requests a vote from a peer during an election.
message VoteRequest {
  string candidate_id = 1;
  uint64 term = 2;
  uint64 last_seq = 3;
}

message VoteResponse {
  bool granted = 1;
  uint64 term = 2;
}

// Snapshot installation: leader sends complete state to a stale follower.
message InstallSnapshotRequest {
  string leader_id = 1;
  uint64 term = 2;
  // msgpack-encoded Vec<KVEntry>
  bytes snapshot = 3;
  uint64 last_seq = 4;
}

message InstallSnapshotResponse {
  bool success = 1;
  uint64 term = 2;
}

service RaftInternal {
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse) {}
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse) {}
  rpc RequestVote(VoteRequest) returns (VoteResponse) {}
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse) {}
}
