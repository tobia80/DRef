[workspace]
resolver = "2"
members = [
    "dref-core",
    "dref-redis",
    "dref-raft",
    "examples",
    "interop-node",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tobia80/DRef"
version = "0.1.0"

[workspace.dependencies]
tokio = { version = "1.52", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
rmp-serde = "1.3"
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
rand = "0.10"
