[package]
name = "dref-redis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Redis backend for DRef (port of dref-redis Scala)"

[features]
# Disabled by default — integration tests require Redis at localhost:6379.
# Enable with `--features test-redis` to run them.
default = []
test-redis = []

[dependencies]
dref-core = { path = "../dref-core" }

tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
rmp-serde = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }

redis = { version = "1.2", features = [
    "tokio-comp",
    "connection-manager",
    "tokio-rustls-comp",
] }

[dev-dependencies]
tokio = { workspace = true }
futures = { workspace = true }
